name: Archive Build

# Actions artifacts expire after 90 days. Copy every successful main-branch build
# into its own GitHub Release and record its version info in BUILDS.md.
on:
  workflow_run:
    workflows: ["Build Manager"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of a successful Build Manager run to archive'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-build
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve build run
        id: run
        run: |
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          name=$(jq -r .name <<<"$run_json")
          conclusion=$(jq -r .conclusion <<<"$run_json")
          if [ "$name" != "Build Manager" ] || [ "$conclusion" != "success" ]; then
            echo "::error::run $RUN_ID is '$name' ($conclusion), expected a successful Build Manager run"
            exit 1
          fi
          {
            echo "sha=$(jq -r .head_sha <<<"$run_json")"
            echo "event=$(jq -r .event <<<"$run_json")"
            echo "created=$(jq -r .created_at <<<"$run_json")"
            echo "url=$(jq -r .html_url <<<"$run_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Collect version info
        id: info
        env:
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          git worktree add --detach build-src "$SHA"

          # Upstream tags are not pushed here; fetch them aside to find the merged upstream release
          git fetch --no-tags --quiet https://github.com/tiann/KernelSU.git '+refs/tags/v*:refs/upstream-tags/v*' || true
          base=$(git for-each-ref --merged "$SHA" --sort=-v:refname --format='%(refname:lstrip=2)' refs/upstream-tags | head -n1)

          # APK is named <app>_<versionName>_<versionCode>-release.apk by the manager build
          apk=$(find artifacts/manager -name '*.apk' | head -n1)
          stem=$(basename "$apk" -release.apk)
          code=${stem##*_}
          version_name=${stem#*_}
          version_name=${version_name%_*}
          expected_code=$((30000 + $(git rev-list --count "$SHA")))
          if [ "$code" != "$expected_code" ]; then
            echo "::warning::APK version code $code differs from git-derived $expected_code"
          fi

          # Use the build commit's own config; also proves the APK is accepted by its kernel
          check=$(python3 build-src/diy/ksu_diy.py check --apk "$apk")
          echo "$check"
          pkg=$(sed -n 's/^package name : \([^ ]*\).*/\1/p' <<<"$check")
          cert_size=$(sed -n 's/^certificate  : size=\([^ ]*\) hash=.*/\1/p' <<<"$check")
          cert_hash=$(sed -n 's/^certificate  : size=[^ ]* hash=\(.*\)/\1/p' <<<"$check")

          if [ -n "$base" ]; then tag="v${base#v}-diy.${code}"; else tag="build-${code}"; fi

          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          latest_code=${latest##*.}
          case "$latest_code" in ''|*[!0-9]*) latest_code=0 ;; esac
          if [ "$code" -ge "$latest_code" ]; then make_latest=true; else make_latest=false; fi

          {
            echo "apk=$apk"
            echo "code=$code"
            echo "version_name=$version_name"
            echo "base=${base:-unknown}"
            echo "tag=$tag"
            echo "make_latest=$make_latest"
            echo "pkg=$pkg"
            echo "cert_size=$cert_size"
            echo "cert_hash=$cert_hash"
            echo "subject=$(git show -s --format=%s "$SHA")"
            echo "committed=$(git show -s --format=%cI "$SHA")"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release files
        env:
          APK: ${{ steps.info.outputs.apk }}
          CODE: ${{ steps.info.outputs.code }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          mkdir -p release
          cp "$APK" "release/KernelSU_${TAG}_${CODE}-release.apk"
          for dir in artifacts/*-lkm; do
            [ -d "$dir" ] || continue
            ko=$(find "$dir" -name '*_kernelsu.ko' | head -n1)
            name=$(basename "$dir")
            cp "$ko" "release/lkm-${name%-lkm}_kernelsu.ko"
          done
          for dir in artifacts/ksud-* artifacts/ksuinit-*; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              ext=""
              case "$f" in *.exe) ext=.exe ;; esac
              cp "$f" "release/$(basename "$dir")$ext"
            done
          done
          if [ -d artifacts/mappings ]; then
            (cd artifacts/mappings && zip -qr "$GITHUB_WORKSPACE/release/mappings-${CODE}.zip" .)
          fi
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Write build notes
        env:
          SHA: ${{ steps.run.outputs.sha }}
          RUN_EVENT: ${{ steps.run.outputs.event }}
          RUN_CREATED: ${{ steps.run.outputs.created }}
          RUN_URL: ${{ steps.run.outputs.url }}
          CODE: ${{ steps.info.outputs.code }}
          VERSION_NAME: ${{ steps.info.outputs.version_name }}
          BASE: ${{ steps.info.outputs.base }}
          TAG: ${{ steps.info.outputs.tag }}
          PKG: ${{ steps.info.outputs.pkg }}
          CERT_SIZE: ${{ steps.info.outputs.cert_size }}
          CERT_HASH: ${{ steps.info.outputs.cert_hash }}
          SUBJECT: ${{ steps.info.outputs.subject }}
          COMMITTED: ${{ steps.info.outputs.committed }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          e = os.environ
          repo_url = f"https://github.com/{e['GITHUB_REPOSITORY']}"
          code, tag, sha, pkg = e["CODE"], e["TAG"], e["SHA"], e["PKG"]
          short = sha[:8]
          commit_url = f"{repo_url}/commit/{sha}"
          release_url = f"{repo_url}/releases/tag/{tag}"
          subject = e["SUBJECT"].replace("|", "\\|")


          def utc8(ts):
              t = datetime.fromisoformat(ts.replace("Z", "+00:00"))
              return t.astimezone(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")


          def describe(name):
              if name.endswith(".apk"):
                  return "管理器 APK（DIY 密钥签名，内嵌 ksud 和全部 LKM）"
              m = re.fullmatch(r"lkm-(aarch64|x86_64)-(.+)_kernelsu\.ko", name)
              if m:
                  arch = "arm64 真机" if m.group(1) == "aarch64" else "x86_64 模拟器"
                  return f"内核模块 LKM，KMI {m.group(2)}（{arch}）"
              if name.startswith("ksud-"):
                  if "linux-android" in name:
                      return "设备端 ksud（APK 已内嵌）"
                  if "windows" in name:
                      return "电脑端 ksud（Windows），可在电脑上修补 boot"
                  if "apple-darwin" in name:
                      return "电脑端 ksud（macOS）"
                  return "电脑端 ksud（Linux）"
              if name.startswith("ksuinit-"):
                  return "ksuinit（ksud 已内嵌）"
              if name.startswith("mappings-"):
                  return "R8 混淆映射，用于还原管理器崩溃堆栈"
              return ""


          def order(name):
              for i, prefix in enumerate(("KernelSU_", "lkm-aarch64", "lkm-x86_64", "ksud-", "ksuinit-", "mappings-")):
                  if name.startswith(prefix):
                      return (i, name)
              return (9, name)


          def size(n):
              return f"{n / 1048576:.1f} MB" if n >= 1048576 else f"{n / 1024:.0f} KB"


          sums = {}
          for line in Path("release/SHA256SUMS.txt").read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              sums[name.lstrip("*")] = digest
          names = sorted(sums, key=order)
          kmis = sorted({m.group(1) for n in names if (m := re.fullmatch(r"lkm-aarch64-(.+)_kernelsu\.ko", n))})
          event = {"push": "推送到 main", "workflow_dispatch": "手动触发"}.get(e["RUN_EVENT"], e["RUN_EVENT"])

          info = [
              f"# 构建 {code}",
              "",
              "| 项目 | 值 |",
              "|---|---|",
              f"| 构建号（KernelSU 版本号） | `{code}` |",
              f"| 管理器版本名 | `{e['VERSION_NAME']}` |",
              f"| 上游基线 | tiann/KernelSU `{e['BASE']}` |",
              f"| 提交 | [`{short}`]({commit_url}) {subject} |",
              f"| 提交时间 | {utc8(e['COMMITTED'])} (UTC+8) |",
              f"| 构建时间 | {utc8(e['RUN_CREATED'])} (UTC+8) |",
              f"| 构建来源 | {event}，[Actions 运行记录]({e['RUN_URL']}) |",
              f"| 管理器包名 | `{pkg}` |",
              f"| 签名证书 | 大小 `{e['CERT_SIZE']}`，SHA-256 `{e['CERT_HASH']}` |",
              f"| LKM 覆盖的 KMI | {', '.join(kmis)} |",
              "",
              "## 文件",
              "",
              "| 文件 | 说明 | 大小 | SHA-256 |",
              "|---|---|---|---|",
          ]
          for name in names:
              info.append(f"| `{name}` | {describe(name)} | {size(Path('release', name).stat().st_size)} | `{sums[name]}` |")
          info += [
              "",
              "下载后可用 `sha256sum -c SHA256SUMS.txt` 校验。",
              "",
              f"内核 / LKM 只认包名为 `{pkg}` 且用上述证书签名的管理器；不同构建之间包名或证书不同时，管理器和内核要配套使用。",
              "",
          ]
          Path("release/BUILD_INFO.md").write_text("\n".join(info), encoding="utf-8")

          start, end = "<!-- BUILDS:START -->", "<!-- BUILDS:END -->"
          builds = Path("BUILDS.md")
          head, rest = builds.read_text(encoding="utf-8").split(start, 1)
          body, tail = rest.split(end, 1)
          rows = {}
          for line in body.splitlines():
              m = re.match(r"\| (\d+) \|", line)
              if m:
                  rows[int(m.group(1))] = line
          rows[int(code)] = (
              f"| {code} | {utc8(e['RUN_CREATED'])} | [`{short}`]({commit_url}) {subject} | {e['BASE']} "
              f"| `{pkg}` | `{e['CERT_SIZE']}` `{e['CERT_HASH'][:12]}…` | [{tag}]({release_url}) |"
          )
          header = [
              "| 构建号 | 构建时间 (UTC+8) | 提交 | 上游基线 | 管理器包名 | 签名证书 | 产物 |",
              "|---|---|---|---|---|---|---|",
          ]
          table = "\n".join(header + [rows[k] for k in sorted(rows, reverse=True)])
          builds.write_text(f"{head}{start}\n\n{table}\n\n{end}{tail}", encoding="utf-8")
          EOF
          cat release/BUILD_INFO.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ steps.run.outputs.sha }}
          name: Build ${{ steps.info.outputs.code }}
          body_path: release/BUILD_INFO.md
          files: release/*
          fail_on_unmatched_files: true
          make_latest: ${{ steps.info.outputs.make_latest }}

      - name: Record build in BUILDS.md
        env:
          CODE: ${{ steps.info.outputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILDS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: Record build ${CODE}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
